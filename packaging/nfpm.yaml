name: nomina-app
arch: amd64
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: "Jonnathan Cundar Rosero <jcrjonnathan@gmail.com>"
vendor: "Mi Empresa"
license: Proprietary
description: |
  Nómina App: calculadora de Sueldos
  Liquida turnos, recargos nocturnos, dominicales y festivos, y exporta a PDF y Excel.
  Los datos del usuario se guardan en ~/.config/NominaApp.

contents:
  - src: ./artifacts/publish-linux-x64
    dst: /opt/nomina-app
    type: tree

  - src: /opt/nomina-app/CalculadoraDeSalarios.App
    dst: /usr/bin/nomina-app
    type: symlink

  - src: ./packaging/linux/nomina-app.desktop
    dst: /usr/share/applications/nomina-app.desktop
    file_info:
      mode: 0644
  - src: ./packaging/linux/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/nomina-app.png
    file_info:
      mode: 0644
  - src: ./packaging/linux/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/nomina-app.png
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
  rpm:
    depends:
      - fontconfig
      - libX11
      - libICE
      - libSM
  archlinux:
    depends:
      - fontconfig
      - libx11
      - libice
      - libsm
